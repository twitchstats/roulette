<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Рулетка</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#0b0818;--g1:rgba(19,13,42,.92);--g2:rgba(7,5,16,.86);--hair:rgba(255,255,255,.08);--v:124,92,255;--soft:#c9b8ff;--ink:#f6f2ff;--dim:#9086b8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(900px 500px at 15% -10%,rgba(124,92,255,.28),transparent 60%),radial-gradient(800px 500px at 100% 110%,rgba(224,95,184,.18),transparent 60%),var(--void);color:var(--ink);font-family:Manrope,sans-serif;overflow-x:hidden}
.glass{background:linear-gradient(155deg,var(--g1),var(--g2));border:1px solid var(--hair);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.5px}
.grad{background:linear-gradient(100deg,#fff 8%,var(--soft) 125%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
button,input{font:inherit;color:inherit}
.btn{border:0;cursor:pointer;font-weight:800;border-radius:12px;padding:13px 22px;background:linear-gradient(135deg,#7c5cff,#b565d8);box-shadow:0 8px 28px -8px rgba(124,92,255,.9);transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--hair);padding:9px 14px;font-size:13px}
input{position:relative;z-index:5;min-width:0;user-select:text;-webkit-user-select:text;pointer-events:auto;background:rgba(8,9,20,.6);border:1px solid var(--hair);border-radius:12px;padding:13px 16px;outline:0;width:100%;transition:.2s}
input:focus{border-color:rgba(var(--v),.7);box-shadow:0 0 0 3px rgba(var(--v),.2)}
/* start */
#start{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#start .box{width:min(460px,100%);padding:34px;text-align:center}
#start h1{font-size:40px;margin-bottom:6px}#start p{color:var(--dim);font-size:14px;margin-bottom:22px}
.tw{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.tw span{font-weight:800;color:var(--soft);font-size:22px}
.row2{display:flex;gap:10px;margin-top:10px}
label{display:block;text-align:left;font-size:11px;color:var(--dim);font-weight:700;margin:14px 0 6px;letter-spacing:.6px;text-transform:uppercase}
#app{display:none;max-width:1280px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
header h1{font-size:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(8,9,20,.55);border:1px solid var(--hair);border-radius:100px;padding:7px 14px;font-size:12px;font-weight:700}
#dot{width:8px;height:8px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}#dot.live{background:#59e9ff;box-shadow:0 0 8px #59e9ff,0 0 16px #59e9ff;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.grid>div{min-width:0}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
/* roulette */
#stage{padding:22px}
#viewport{position:relative;height:210px;overflow:hidden;border-radius:14px;background:rgba(5,4,12,.7);border:1px solid var(--hair);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
#strip{position:absolute;left:0;top:14px;display:flex;gap:10px;will-change:transform}
.card{flex:0 0 150px;height:182px;border-radius:12px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,rgba(var(--c),.06),rgba(var(--c),.28));border:1px solid rgba(var(--c),.45);overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:rgb(var(--c));box-shadow:0 0 18px rgb(var(--c))}
.card img,.ava{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid rgb(var(--c));box-shadow:0 0 22px -2px rgba(var(--c),.8);background:#1a1330}
.ava{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;font-family:'Bricolage Grotesque'}
.card b{font-size:14px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.win{animation:winp .9s ease-in-out infinite alternate}
@keyframes winp{to{box-shadow:0 0 40px 4px rgba(var(--c),.9);transform:scale(1.05)}}
#marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;z-index:3;box-shadow:0 0 14px #fff,0 0 30px rgba(var(--v),1);border-radius:3px;pointer-events:none}
#marker::before,#marker::after{content:"";position:absolute;left:-7px;border:8.5px solid transparent}
#marker::before{top:0;border-top-color:#fff}#marker::after{bottom:0;border-bottom-color:#fff}
#controls{display:flex;justify-content:center;gap:12px;margin-top:14px;align-items:center;flex-wrap:wrap}
#spin{font-size:18px;padding:16px 46px;letter-spacing:.5px}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);cursor:pointer;font-weight:600}
.tog input{width:auto;accent-color:#7c5cff}
#hist{margin-top:20px;padding:18px}
#hist h2,#side h2{font-size:18px;margin-bottom:12px}
#hlist{display:flex;gap:10px;flex-wrap:wrap}
.h{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:100px;padding:5px 14px 5px 5px;font-size:13px;font-weight:700}
.h img,.h .ava{width:26px;height:26px;border-width:2px;font-size:12px;box-shadow:none}
.empty{color:var(--dim);font-size:13px}
/* side */
#side{padding:18px;display:flex;flex-direction:column;max-height:calc(100vh - 110px);position:sticky;top:20px}
@media(max-width:960px){#side{position:static;max-height:520px}}
#plist{overflow:auto;display:flex;flex-direction:column;gap:7px;margin:12px 0;flex:1;min-height:120px}
.p{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateX(14px)}}
.p .ava,.p img{width:32px;height:32px;border-width:2px;font-size:14px;box-shadow:none;flex-shrink:0}
.p span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px}.p button:hover{color:#ff6b8a}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,3,14,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
#mbox{padding:44px 60px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1);border-color:rgba(var(--c),.7);box-shadow:0 0 90px -10px rgba(var(--c),.9)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#mbox small{color:var(--soft);letter-spacing:3px;font-weight:800;font-size:12px}
#mbox img,#mbox .ava{width:150px;height:150px;font-size:60px;margin:20px auto 16px;border:5px solid rgb(var(--c));box-shadow:0 0 60px rgba(var(--c),.8)}
#mbox h2{font-size:44px;margin-bottom:22px}
#conf{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:60}

/* ===== ВИЗУАЛ v2 ===== */
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);pointer-events:none;z-index:0}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.5;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#7c5cff;left:-120px;top:-120px}.bg i:nth-child(2){background:#e05fb8;right:-150px;bottom:-150px;animation-delay:-6s}.bg i:nth-child(3){background:#3fb8c9;left:45%;top:40%;width:340px;height:340px;opacity:.22;animation-delay:-11s}
@keyframes fl{to{transform:translate(90px,70px) scale(1.25)}}
#start,#app{position:relative;z-index:1}
.glass{backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px -30px rgba(0,0,0,.8)}
#start .box{position:relative;padding:44px 38px;border-radius:24px;border:1px solid transparent;background:linear-gradient(155deg,rgba(19,13,42,.95),rgba(7,5,16,.92)) padding-box,conic-gradient(from var(--a,0deg),#7c5cff,#e05fb8,#3fb8c9,#7c5cff) border-box;animation:spinb 6s linear infinite;box-shadow:0 0 80px -20px rgba(124,92,255,.7)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinb{to{--a:360deg}}
.logo{width:76px;height:76px;margin:0 auto 16px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7c5cff,#e05fb8);box-shadow:0 12px 40px -6px rgba(124,92,255,.9);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-4deg)}}
#start h1{font-size:46px;text-shadow:0 0 40px rgba(124,92,255,.5)}
.tw{background:rgba(8,9,20,.6);border:1px solid var(--hair);border-radius:14px;padding:4px 6px 4px 16px;transition:.2s}
.tw:focus-within{border-color:rgba(var(--v),.8);box-shadow:0 0 0 4px rgba(var(--v),.2)}
.tw input{border:0;background:transparent;box-shadow:none!important;font-size:18px;font-weight:700}
#viewport{height:236px;border-radius:18px;background:radial-gradient(ellipse at 50% 50%,rgba(var(--v),.22),rgba(5,4,12,.9) 70%);box-shadow:inset 0 0 60px rgba(0,0,0,.8),0 0 60px -20px rgba(var(--v),.6)}
#strip{top:20px}
.card{flex:0 0 150px;height:196px;border-radius:14px;border:1px solid rgba(var(--c),.6);background:radial-gradient(circle at 50% 38%,rgba(var(--c),.45),rgba(var(--c),.06) 65%),linear-gradient(180deg,#140e2b,#0a0718);box-shadow:inset 0 0 30px -8px rgba(var(--c),.6)}
.card::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-18deg);animation:sh 4s ease-in-out infinite}
@keyframes sh{60%,100%{left:140%}}
.rl{position:absolute;top:10px;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:1.5px;color:rgb(var(--c));text-shadow:0 0 10px rgba(var(--c),.9)}
.card img,.ava{margin-top:12px}
.card b{font-size:15px;text-shadow:0 2px 6px #000}
.card.win{z-index:2;animation:winp .7s ease-in-out infinite alternate}
#marker{width:4px;margin-left:-2px;background:linear-gradient(180deg,#fff,#e9dcff 50%,#fff);box-shadow:0 0 18px #fff,0 0 50px rgba(var(--v),1),0 0 100px rgba(var(--v),.8)}
#spin{position:relative;font-size:20px;padding:18px 60px;letter-spacing:2px;border-radius:16px;animation:beat 2.2s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 8px 50px -2px rgba(124,92,255,1),0 0 0 8px rgba(124,92,255,.12)}}
.p{transition:.2s}.p:hover{border-color:rgba(var(--v),.6);transform:translateX(-3px);background:rgba(var(--v),.1)}
.h{border-color:rgba(var(--v),.35);background:rgba(var(--v),.1)}
#cnt{background:rgba(var(--v),.25);border-radius:100px;padding:2px 12px;font-size:15px}
#mbox{border-radius:28px}#mbox h2{font-size:54px}
.p .ava,.p img,.h .ava,.h img,#mbox .ava,#mbox img{margin-top:0}#mbox .ava,#mbox img{margin:20px auto 16px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(var(--v),.5);border-radius:6px}

.modes{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:6px}
.mode{flex:0 0 auto;display:flex;align-items:center;gap:10px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:14px;padding:10px 16px;font-weight:800;font-size:13px;transition:.2s;white-space:nowrap}
.mode i{font-style:normal;font-size:20px}.mode small{display:block;font-size:10px;color:var(--dim);font-weight:600;margin-top:1px}
.mode:hover{transform:translateY(-2px);border-color:rgba(var(--v),.5)}
.mode.on{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(224,95,184,.22));border-color:rgba(var(--v),.9);box-shadow:0 0 28px -6px rgba(var(--v),.9)}
.emo{font-size:40px!important;font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif!important}
.tagb{font-size:9px;font-weight:800;letter-spacing:.8px;padding:2px 7px;border-radius:6px;background:rgba(var(--v),.3);color:var(--soft)}
.tagb.s{background:rgba(255,205,60,.22);color:#ffd84a}.tagb.m{background:rgba(63,200,120,.22);color:#5df0a0}
.p .emo{font-size:17px!important}.h .emo{font-size:13px!important}#mbox .emo{font-size:72px!important}
.card.it b{white-space:normal;text-align:center;line-height:1.15;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:134px}

/* ===== ВИЗУАЛ v3 ===== */
/* искры на фоне */
.bg b{position:absolute;bottom:-20px;border-radius:50%;background:#fff;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.75}100%{transform:translateY(-112vh) translateX(40px);opacity:0}}
/* сцена подсвечивается цветом карточки под маркером */
#stage{position:relative;transition:box-shadow .3s,border-color .3s;border-color:rgba(var(--amb,124,92,255),.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px -30px rgba(0,0,0,.8),0 0 120px -45px rgba(var(--amb,124,92,255),.95)}
/* бегущие огни по краям ленты */
#viewport::before,#viewport::after{content:"";position:absolute;left:0;right:0;height:4px;z-index:2;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(var(--amb,124,92,255),.9) 0 8px,transparent 8px 28px);opacity:.5;transition:opacity .3s}
#viewport::before{top:7px}#viewport::after{bottom:7px}
.spinning #viewport::before,.spinning #viewport::after{opacity:1;animation:led .45s linear infinite}
@keyframes led{to{background-position:28px 0}}
.card{will-change:auto}
/* подпись под лентой */
#say{height:22px;margin-top:16px;text-align:center;font-weight:700;font-size:14px;color:var(--soft);letter-spacing:.3px}
#say.pop{animation:sayin .35s}
@keyframes sayin{from{opacity:0;transform:translateY(6px)}}
/* скорость */
.seg{display:flex;background:rgba(8,9,20,.6);border:1px solid var(--hair);border-radius:12px;padding:3px}
.seg button{border:0;background:none;cursor:pointer;padding:8px 12px;border-radius:9px;font-weight:700;font-size:12px;color:var(--dim);transition:.2s;white-space:nowrap}
.seg button.on{background:rgba(var(--v),.4);color:#fff}
/* жёсткость заданий */
.tiers{display:none;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.tiers .tl{font-size:12px;font-weight:700;color:var(--dim);margin-right:2px}
.tier{cursor:pointer;font-size:12px;font-weight:800;padding:7px 14px;border-radius:100px;border:1px solid var(--hair);background:rgba(255,255,255,.04);color:var(--dim);transition:.2s;user-select:none}
.tier.t1{--t:63,200,120}.tier.t2{--t:255,205,60}.tier.t3{--t:235,75,75}
.tier:hover{transform:translateY(-1px)}
.tier.on{color:#fff;border-color:rgba(var(--t),.85);background:rgba(var(--t),.18);box-shadow:0 0 18px -6px rgba(var(--t),.9)}
.tagb.t1{background:rgba(63,200,120,.22);color:#5df0a0}.tagb.t2{background:rgba(255,205,60,.22);color:#ffd84a}.tagb.t3{background:rgba(235,75,75,.25);color:#ff8b8b}
.ava.emo.num{font-family:'Bricolage Grotesque',sans-serif!important;font-weight:800}
/* тосты: кто вошёл */
#toasts{position:fixed;left:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(14,10,32,.92);border:1px solid rgba(var(--c),.6);box-shadow:0 0 24px -6px rgba(var(--c),.8);animation:toast .4s cubic-bezier(.2,1.4,.4,1),toastout .4s 3.2s forwards}
.toast i{width:9px;height:9px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 10px rgb(var(--c))}
@keyframes toast{from{opacity:0;transform:translateX(-30px)}}
@keyframes toastout{to{opacity:0;transform:translateX(-20px)}}
/* победное окно */
#modal{overflow:hidden}
#rays{position:absolute;left:50%;top:50%;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(rgba(var(--c),.3) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:rot 28s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#mbox{position:relative;z-index:1;max-width:min(760px,100%)}
#mrar{min-height:26px;margin:-4px 0 12px}
.rtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:2px;padding:4px 12px;border-radius:100px;color:rgb(var(--c));background:rgba(var(--c),.15);border:1px solid rgba(var(--c),.6);text-shadow:0 0 10px rgba(var(--c),.8)}
#mname.long{font-size:36px}
#msub{color:var(--dim);font-weight:600;margin:-8px 0 24px;font-size:15px}
#mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
#mbtns .btn.ghost{padding:13px 18px;font-size:14px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:0}
@media(prefers-reduced-motion:reduce){.bg b,.bg i,.card::before,#rays{animation:none}#spin{animation:none}}

/* ===== ВИЗУАЛ v4 ===== */
#stage{padding:26px 26px 22px;border-radius:26px}
#viewport{height:248px;border-radius:20px;border:1px solid rgba(var(--amb,124,92,255),.35);background:linear-gradient(90deg,transparent 38%,rgba(var(--amb,124,92,255),.16) 50%,transparent 62%),radial-gradient(ellipse at 50% 50%,rgba(var(--v),.18),rgba(5,4,12,.95) 72%);box-shadow:inset 0 0 80px rgba(0,0,0,.9),0 0 70px -24px rgba(var(--amb,124,92,255),.9);transition:border-color .3s,box-shadow .3s}
#strip{top:26px;gap:10px}
.card{border-radius:18px;border:1px solid rgba(var(--c),.55);background:radial-gradient(circle at 50% 34%,rgba(var(--c),.5),rgba(var(--c),.05) 62%),linear-gradient(180deg,#181033,#090616);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -30px 40px -28px rgba(var(--c),.7),0 10px 24px -14px rgba(0,0,0,.9)}
.card::after{height:4px;left:18%;right:18%;border-radius:4px 4px 0 0}
.rl{padding:3px 9px;border-radius:100px;background:rgba(0,0,0,.45);border:1px solid rgba(var(--c),.45);top:11px}
.card img,.ava{border-width:3px;box-shadow:0 0 0 4px rgba(var(--c),.15),0 0 26px -2px rgba(var(--c),.9)}
.card.win{box-shadow:0 0 0 2px rgb(var(--c)),0 0 50px 4px rgba(var(--c),.85)}
#marker{width:3px;margin-left:-1.5px;border-radius:0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 12%,#fff 88%,rgba(255,255,255,0))}
#marker::before,#marker::after{left:-9px;border-width:10px;filter:drop-shadow(0 0 8px rgba(var(--amb,124,92,255),1))}
#spin{background:linear-gradient(135deg,#7c5cff,#e05fb8);overflow:hidden;border-radius:18px;box-shadow:0 10px 40px -8px rgba(124,92,255,.95),inset 0 1px 0 rgba(255,255,255,.35)}
#spin::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sh 3.2s ease-in-out infinite}
.seg{border-radius:14px;padding:4px}.seg button.on{background:linear-gradient(135deg,rgba(124,92,255,.6),rgba(224,95,184,.45));box-shadow:0 4px 14px -4px rgba(124,92,255,.9)}
.mode{border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.mode.on{transform:translateY(-2px)}
#hist,#side{border-radius:22px}

const rnd=a=>a[Math.floor(Math.random()*a.length)];
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function rar(n){const r=hash(n)%100;return r<45?RAR[0]:r<75?RAR[1]:r<90?RAR[2]:r<98?RAR[3]:RAR[4]}
const col=p=>p.c||rar(p.name);
const isBig=p=>!!p.big||(!p.item&&(col(p)===RAR[3]||col(p)===RAR[4]));
window.fb=(n,c)=>`<div class="ava" style="--c:${c||rar(n)};color:rgb(${c||rar(n)})">${esc((n.charAt(0)||'?').toUpperCase())}</div>`;
function avatar(p){
  const c=col(p);
  if(p.emoji)return `<div class="ava emo${p.num?' num':''}" style="--c:${c}">${p.emoji}</div>`;
  if(p.img)return `<img src="${ea(p.img)}" referrerpolicy="no-referrer" data-n="${ea(p.name)}" data-c="${c}" style="--c:${c}" onerror="this.outerHTML=fb(this.dataset.n,this.dataset.c)">`;
  return fb(p.name,c);
}
/* ---- аватарки Twitch ---- */
async function loadAva(p){
  if(p.fake)return;
  const l=p.login;
  if(avCache[l]===undefined){
    let u=null;
    try{const t=(await (await fetch('https://decapi.me/twitch/avatar/'+encodeURIComponent(l))).text()).trim();if(t.startsWith('http'))u=t}catch(e){}
    avCache[l]=u||'https://unavatar.io/twitch/'+encodeURIComponent(l)+'?fallback=false';
  }
  p.img=avCache[l];refresh();
}
/* ---- участники ---- */
function getP(login,name){
  name=name||login;login=login.toLowerCase();
  if(!chat[login]){chat[login]={name:name||login,login,img:null,sub:false,mod:false,vip:false,msgs:0,joined:false,out:false};loadAva(chat[login])}
  return chat[login];
}
function pool(){
  const all=Object.values(chat).filter(p=>!p.out);
  if(mode==='viewers')return all.filter(p=>p.joined);
  if(mode==='subs')return all.filter(p=>p.joined&&p.sub);
  if(mode==='mods')return all.filter(p=>p.joined&&(p.mod||p.vip));
  if(mode==='active')return all.filter(p=>p.msgs>0).map(p=>(p.w=p.msgs,p)).sort((a,b)=>b.msgs-a.msgs).slice(0,60);
  if(mode==='tasks')return tasks.map((t,i)=>({name:t.t,emoji:t.e,item:1,i,l:t.l,c:TC[t.l],tag:TN[t.l]})).filter(p=>tiers.has(p.l));
  if(mode==='yesno')return [{name:'ДА',emoji:'✅',c:'63,200,120',item:1,static:1},{name:'НЕТ',emoji:'❌',c:'235,75,75',item:1,static:1,sad:1}];
  if(mode==='ball')return BALL;
  if(mode==='dice')return DICE;
  return [{name:'ОРЁЛ',emoji:'🦅',c:'255,205,60',item:1,static:1},{name:'РЕШКА',emoji:'🪙',c:'136,71,255',item:1,static:1}];
}
function wpick(pl){const t=pl.reduce((a,p)=>a+(p.w||1),0);let r=Math.random()*t;for(const p of pl){r-=(p.w||1);if(r<=0)return p}return pl[0]}
function refresh(){const n=performance.now();if(n-lastR<120)return;lastR=n;renderParts();fillIdle()}
function renderParts(){
  const pl=pool(),M=MODES.find(m=>m.id===mode),st=STATIC.includes(mode);
  $('cnt').textContent=pl.length;
  $('ptitle').textContent=mode==='tasks'?'Задания':st?'Варианты':mode==='active'?'Топ чата':'Участники';
  $('add').placeholder=mode==='tasks'?'Добавить задание':'Добавить ник вручную';
  $('add').parentNode.style.display=st?'none':'flex';
  $('tiers').style.display=mode==='tasks'?'flex':'none';
  $('plist').innerHTML=pl.length?pl.map((p,i)=>`<div class="p">${avatar(p)}<span>${esc(p.name)}</span>${p.item&&p.l?`<em class="tagb t${p.l}">${TN[p.l]}</em>`:''}${p.sub?'<em class="tagb s">SUB</em>':''}${p.mod?'<em class="tagb m">MOD</em>':p.vip?'<em class="tagb m">VIP</em>':''}${mode==='active'?`<em class="tagb">${p.msgs}</em>`:''}${p.static?'':`<button onclick="rm('${ea(p.login||'')}',${p.i??-1})">✕</button>`}</div>`).join(''):'<div class="empty">'+(mode==='tasks'?'Включи хотя бы один уровень жёсткости выше':mode==='subs'?'Подписчики появятся, когда напишут '+esc(kw||'сообщение'):mode==='mods'?'Тут будут модеры и VIP из чата':mode==='active'?'Ждём сообщения в чате…':'Ждём зрителей… пусть пишут '+esc(kw||'что угодно'))+'</div>';
  const pe=$('plist');pe.scrollTop=mode==='active'?0:pe.scrollHeight;
  $('kwchip').textContent=M.e+' '+M.t+(mode==='viewers'||mode==='subs'||mode==='mods'?' · '+(kw?'пиши '+kw:'любое сообщение'):'');
}
window.rm=(l,i)=>{if(mode==='tasks'&&i>=0)tasks.splice(i,1);else if(chat[l])chat[l].out=true;renderParts();fillIdle()};
function cardHTML(p,win){const c=col(p);return `<div class="card${win?' win':''}${p.item?' it':''}${!p.item&&RAR.indexOf(c)>2?' r'+RAR.indexOf(c):''}" style="--c:${c}"><em class="rl">${p.item?(p.tag||(p.static?'ИСХОД':'ЗАДАНИЕ')):RN[c]}</em>${avatar(p)}<b>${esc(p.name)}</b></div>`}
function fillIdle(){
  if(spinning)return;
  const pl=pool();
  if(!pl.length){strip.innerHTML=Array.from({length:14},()=>cardHTML({name:'?',c:'90,80,140'})).join('');}
  else{const a=[];for(let i=0;i<20;i++)a.push(pl[i%pl.length]);strip.innerHTML=a.map(p=>cardHTML(p)).join('')}
  strip.style.transform=`translateX(${$('viewport').clientWidth/2-80-8*160}px)`;
}
function renderModes(){
  $('modes').innerHTML=MODES.map(m=>`<div class="mode${m.id===mode?' on':''}" data-m="${m.id}"><i>${m.e}</i><div>${m.t}<small>${m.d}</small></div></div>`).join('');
  $('modes').querySelectorAll('.mode').forEach(el=>el.onclick=()=>{if(spinning)return;mode=el.dataset.m;renderModes();lastR=0;refresh()});
}
function renderTiers(){
  $('tiers').innerHTML='<span class="tl">Жёсткость заданий:</span>'+[1,2,3].map(l=>`<div class="tier t${l}${tiers.has(l)?' on':''}" data-l="${l}">${TI[l]} ${TNL[l]}</div>`).join('');
  $('tiers').querySelectorAll('.tier').forEach(el=>el.onclick=()=>{if(spinning)return;const l=+el.dataset.l;if(tiers.has(l)){if(tiers.size>1)tiers.delete(l)}else tiers.add(l);renderTiers();lastR=0;refresh()});
}
$('spd').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(spinning)return;spd=b.dataset.s;$('spd').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
/* ---- звук ---- */
let ac;
function A(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function note(f,t0=0,d=.15,type='triangle',v=.06){
  if(!$('snd').checked)return;const c=A();if(!c)return;
  try{const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.02)}catch(e){}
}
const tick=(f=700)=>note(f,0,.08,'triangle',.05);
const thump=()=>{note(60,0,.18,'sine',.3);note(50,.16,.22,'sine',.3)};
function fanfare(big){
  (big?[523,659,784,1047,1319,1568]:[523,659,784,1047]).forEach((f,i)=>note(f,i*.1,.35,'triangle',.07));
  if(big){[523,659,784].forEach(f=>note(f,.65,.9,'sine',.05));note(2093,.7,.5,'sine',.03)}else note(1047,.4,.5,'sine',.04);
}
function sadSound(){[392,370,349,294].forEach((f,i)=>note(f,i*.24,i===3?.7:.3,'sawtooth',.035))}
/* ---- эффекты ---- */
function say(t){const e=$('say');e.textContent=t;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function flash(c){const f=$('flash');f.style.background=`radial-gradient(circle at 50% 45%,rgba(${c},.65),rgba(${c},.12) 55%,transparent 75%)`;f.animate([{opacity:1},{opacity:0}],{duration:800,easing:'ease-out'})}
function shake(){$('app').animate([{transform:'translate(0,0)'},{transform:'translate(-8px,4px)'},{transform:'translate(7px,-5px)'},{transform:'translate(-5px,-3px)'},{transform:'translate(4px,5px)'},{transform:'translate(0,0)'}],{duration:450})}
function toast(p){
  const box=$('toasts'),d=document.createElement('div');
  d.className='toast';d.style.setProperty('--c',col(p));
  d.innerHTML=`<i></i><span><b>${esc(p.name)}</b> в рулетке</span>`;
  box.appendChild(d);while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>d.remove(),3700);
}
function phrase(p){
  if(mode==='tasks')return rnd(PH.task);
  if(mode==='yesno')return p.name==='ДА'?'Судьба сказала ДА':'Судьба против… 😬';
  if(mode==='coin')return 'Монета не врёт';
  if(mode==='ball')return 'Шар не ошибается';
  if(mode==='dice')return p.big?'НАТУРАЛЬНАЯ ДВАДЦАТКА!':p.sad?'Кубик предал…':'Кубик брошен';
  return rnd(PH[Math.max(0,RAR.indexOf(col(p)))]);
}
/* ---- рулетка ---- */
const easeOut=t=>1-Math.pow(1-t,4),easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function spin(){
  const pl=pool();
  if(spinning||!pl.length)return;
  spinning=true;$('spin').disabled=true;$('stage').classList.add('spinning');A();
  const win=wpick(pl),N=70,W=54,items=[];
  for(let i=0;i<N;i++)items.push(i===W?win:wpick(pl));
  strip.innerHTML=items.map(p=>cardHTML(p)).join('');
  const cards=[...strip.children],cw=160,vw=$('viewport').clientWidth,S=SPD[spd],mk=$('marker');
  const target=-(W*cw+75+(Math.random()*110-55)-vw/2),start=vw/2-80;
  const over=S.drama?target-cw*.92:target;  /* в «драме» сначала чуть проскакиваем на соседа */
  let last=-1;
  const setX=(x,pr)=>{
    strip.style.transform=`translateX(${x}px)`;
    const ci=(vw/2-x-75)/cw,idx=Math.round(ci);
    for(let k=idx-6;k<=idx+6;k++){const c=cards[k];if(!c)continue;const d=Math.abs(k-ci);const rot=Math.max(-38,Math.min(38,(k-ci)*15));c.style.transform=`perspective(700px) rotateY(${rot.toFixed(1)}deg) scale(${(1+.14*Math.max(0,1-d/1.6)).toFixed(3)})`;c.style.zIndex=d<.6?2:''}
    if(idx!==last){
      last=idx;tick(520+pr*420+Math.random()*60);
      if(items[idx])$('stage').style.setProperty('--amb',col(items[idx]));
      mk.animate([{transform:'scaleX(1)',filter:'brightness(1)'},{transform:'scaleX(1.9)',filter:'brightness(1.7)'},{transform:'scaleX(1)',filter:'brightness(1)'}],{duration:110});
    }
  };
  const run=(from,to,dur,ease,cb)=>{const t0=performance.now();(function f(now){const t=Math.min(1,(now-t0)/dur),e=ease(t);setX(from+(to-from)*e,e);if(t<1)requestAnimationFrame(f);else cb()})(t0)};
  const finish=()=>{clearInterval(sayT);$('stage').classList.remove('spinning');done(win,W)};
  strip.style.transform=`translateX(${start}px)`;
  say(SAY[0]);sayT=setInterval(()=>say(rnd(SAY)),S.dur>6000?1500:1100);
  run(start,over,S.dur,easeOut,()=>{
    if(!S.drama)return finish();
    clearInterval(sayT);say('Стоп… неужели он?! 😱');thump();setTimeout(thump,450);
    setTimeout(()=>{say('…а нет! Ещё чуть-чуть!');run(over,target,1500,easeIO,finish)},1000);
  });
}
function done(win,W){
  const c=col(win),big=isBig(win);
  strip.children[W].classList.add('win');
  $('stage').style.setProperty('--amb',c);
  win.sad?sadSound():fanfare(big);
  flash(c);if(big)shake();
  say(win.sad?'Ой-ой…':big?'🔥 ВОТ ЭТО ДА! 🔥':'🎉 Готово!');
  setTimeout(()=>{
    lastWin=win;hist.unshift(win);renderHist();
    const m=$('modal');m.style.setProperty('--c',c);
    $('mav').innerHTML=avatar(win);
    $('mname').textContent=win.name;
    $('mname').classList.toggle('long',win.name.length>16);
    let lab=win.item?(LAB[mode]||'ВЫПАЛО'):'ПОБЕДИТЕЛЬ';
    $('mlab').textContent=lab;
    $('mrar').innerHTML=win.item?(win.tag?`<span class="rtag">${win.tag}</span>`:''):`<span class="rtag">${RN[c]}</span>`;
    $('msub').textContent=phrase(win);
    m.classList.add('on');
    confetti(c,big,win.num?'🎲':win.emoji||(big?'⭐':'🎉'));
    if($('rm').checked&&!win.item&&chat[win.login])chat[win.login].out=true;
    spinning=false;$('spin').disabled=false;lastR=0;renderParts();
  },big?1100:800);
}
function renderHist(){$('hlist').innerHTML=hist.length?hist.map(p=>`<div class="h">${avatar(p)}${esc(p.name)}</div>`).join(''):'<span class="empty">Пока никого</span>'}
function closeModal(){$('modal').classList.remove('on');say('Жми КРУТИТЬ или пробел');fillIdle()}
$('mok').onclick=closeModal;
$('mre').onclick=()=>{closeModal();setTimeout(spin,350)};
function confetti(main,big,emoji){
  const c=$('conf'),x=c.getContext('2d'),W=innerWidth,H=innerHeight;
  c.width=W;c.height=H;c.style.width='100%';c.style.height='100%';
  const cols=[main,...RAR].map(r=>`rgb(${r})`);
  if(big)cols.push('rgb(255,205,60)','rgb(255,205,60)','#fff');
  const ps=[];
  const burst=(ox,oy,ang,spread,n,pw)=>{for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*spread,v=pw*(.5+Math.random()*.6);ps.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:Math.random()*8+5,c:rnd(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,e:emoji&&Math.random()<.2?emoji:null})}};
  burst(W/2,H/2,-Math.PI/2,Math.PI*1.2,120,20);
  burst(0,H,-Math.PI/3,.6,big?90:55,big?34:28);
  burst(W,H,-Math.PI*2/3,.6,big?90:55,big?34:28);
  if(big)for(let k=1;k<=4;k++)setTimeout(()=>burst(Math.random()*W,-20,Math.PI/2,.5,30,6),k*350);
  let n=0;const max=big?240:150;
  (function f(){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.vy+=.5;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);
      if(p.e){x.font=(p.s*3)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(p.e,0,0)}
      else{x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
      x.restore()});
    if(++n<max)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.style.width=c.style.height='0'}
  })();
}
/* ---- twitch чат (анонимно) ---- */
function connect(){
  setSt('Подключение…',false);
  ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(Math.random()*99999));ws.send('JOIN #'+chan)};
  ws.onmessage=e=>e.data.split('\r\n').forEach(l=>{
    if(l.startsWith('PING'))return ws.send('PONG :tmi.twitch.tv');
    if(l.includes(' JOIN #'))setSt('Чат #'+chan+' подключён',true);
    const m=l.match(/^(?:@(\S+) )?:(\w+)!\S+ PRIVMSG #\w+ :(.*)$/);
    if(!m)return;
    const tags=Object.fromEntries((m[1]||'').split(';').map(s=>s.split('='))),b=tags.badges||'';
    const p=getP(m[2],tags['display-name']||m[2]);
    p.name=tags['display-name']||p.name;
    p.sub=p.sub||tags.subscriber==='1'||/subscriber|founder/.test(b);
    p.mod=p.mod||tags.mod==='1'||/moderator|broadcaster/.test(b);
    p.vip=p.vip||/vip\//.test(b);
    p.msgs++;
    const txt=m[3].trim(),was=p.joined;
    if(!kw||txt.toLowerCase()===kw.toLowerCase())p.joined=true;
    if(!was&&p.joined&&!p.out)toast(p);
    refresh();
  });
  ws.onclose=()=>{if($('app').style.display==='block'&&chan){setSt('Переподключение…',false);setTimeout(connect,2500)}};
}
function setSt(t,l){$('st').textContent=t;$('dot').classList.toggle('live',l)}
function enter(demo){
  chan=demo?'':$('nick').value.trim().replace(/^@|^#/,'').toLowerCase();
  if(!demo&&!chan)return $('nick').focus();
  kw=$('kw').value.trim();
  try{localStorage.setItem('tr_nick',chan);localStorage.setItem('tr_kw',kw)}catch(e){}
  $('start').style.display='none';$('app').style.display='block';
  chat={};hist=[];mode='viewers';renderModes();renderTiers();renderHist();renderParts();fillIdle();
  if(demo){setSt('Демо-режим',false);fakes(14)}else connect();
}
function fakes(n){for(let i=0;i<n;i++){const nm=NAMES[Math.floor(Math.random()*NAMES.length)]+Math.floor(Math.random()*99);const p=getP(nm);p.fake=1;p.joined=true;p.msgs=1+Math.floor(Math.random()*60);p.sub=Math.random()<.4;p.mod=Math.random()<.1;p.vip=Math.random()<.1}lastR=0;refresh()}
$('go').onclick=()=>enter(false);$('demo').onclick=()=>enter(true);
$('nick').onkeydown=e=>{if(e.key==='Enter')enter(false)};
$('back').onclick=()=>{chan='';ws&&ws.close();$('app').style.display='none';$('start').style.display='flex'};
$('spin').onclick=spin;$('fake').onclick=()=>fakes(5);
$('clr').onclick=()=>{
  if(STATIC.includes(mode))return;
  if(mode==='tasks')tasks=DEF_TASKS.map(t=>({...t}));else Object.values(chat).forEach(p=>{p.joined=false;p.out=false;p.msgs=0});
  lastR=0;refresh();
};
$('addb').onclick=()=>{const v=$('add').value.trim();if(!v)return;if(mode==='tasks')tasks.push({t:v,e:'🎯',l:Math.min(...tiers)});else{const p=getP(v);p.joined=true;p.out=false;p.msgs=Math.max(p.msgs,1)}$('add').value='';lastR=0;refresh()};
$('add').onkeydown=e=>{if(e.key==='Enter')$('addb').click()};
/* пробел — крутить, Esc — закрыть окно */
addEventListener('keydown',e=>{
  if($('app').style.display!=='block')return;
  if(e.key==='Escape'&&$('modal').classList.contains('on'))return $('mok').click();
  if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!$('modal').classList.contains('on')){e.preventDefault();spin()}
});
/* искры на фоне */
(function(){const bg=document.querySelector('.bg');for(let i=0;i<22;i++){const b=document.createElement('b'),s=Math.random()*3+1.5;b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*14}s;animation-delay:-${Math.random()*20}s;box-shadow:0 0 8px #fff`;bg.appendChild(b)}})();
try{$('nick').value=localStorage.getItem('tr_nick')||'';$('kw').value=localStorage.getItem('tr_kw')??'!ролл'}catch(e){}
addEventListener('resize',fillIdle);setTimeout(()=>$('nick').focus(),100);
</script>
